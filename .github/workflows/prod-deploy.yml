name: Release

on:
  release:
    types: [published]

jobs:
  tarball:
    name: Build and attach tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build app
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npm run build
      - name: Get version from tag
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
      - name: Create tar.gz
        run: tar -czvf vertex-web-${{ steps.vars.outputs.tag }}.tar.gz dist
      # Signing is optional: it only runs once the GNUPG_KEY and
      # GNUPG_PASSPHRASE repository secrets are configured.
      - name: Sign tar.gz
        id: sign
        env:
          GNUPG_KEY: ${{ secrets.GNUPG_KEY }}
          GNUPG_PASSPHRASE: ${{ secrets.GNUPG_PASSPHRASE }}
        if: ${{ env.GNUPG_KEY != '' }}
        run: |
          echo "$GNUPG_KEY" | gpg --batch --import
          echo "$GNUPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign vertex-web-${{ steps.vars.outputs.tag }}.tar.gz
      - name: Upload tagged release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            vertex-web-${{ steps.vars.outputs.tag }}.tar.gz
            vertex-web-${{ steps.vars.outputs.tag }}.tar.gz.asc
